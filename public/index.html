<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Serviços</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Faça seu Agendamento</h2>

        <!-- Formulário -->
        <form id="formAgendamento" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" id="nomeCliente" required class="w-full mt-1 border rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Telefone / WhatsApp</label>
                <input type="text" id="telefone" required placeholder="(11) 99999-9999" class="w-full mt-1 border rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Serviço</label>
                <select id="servico" required class="w-full mt-1 border rounded-md p-2 text-sm bg-white">
                    <option value="" disabled selected>Selecione um serviço</option>
                    <option value="Corte de Cabelo">Corte de Cabelo</option>
                    <option value="Barba">Barba</option>
                    <option value="Corte + Barba">Corte + Barba</option>
                    <option value="Manicure">Manicure</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Data</label>
                <input type="date" id="data" required class="w-full mt-1 border rounded-md p-2 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Horário</label>
                <select id="horario" required class="w-full mt-1 border rounded-md p-2 text-sm bg-white">
                    <option value="" disabled selected>Selecione a data primeiro</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700 transition">Confirmar Agendamento</button>
        </form>

        <!-- Mensagem de Confirmação (inicialmente oculta) -->
        <div id="mensagemSucesso" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-md text-center">
            <h3 class="text-green-800 font-bold text-lg mb-2">Agendamento Realizado com Sucesso!</h3>
            <p class="text-sm text-green-700 mb-4">Sua vaga está reservada. Veja os detalhes abaixo:</p>
            <div id="detalhesConfirmacao" class="text-left text-sm text-gray-700 bg-white p-3 rounded border space-y-1"></div>
            <button onclick="novoAgendamento()" class="mt-4 bg-green-600 text-white px-4 py-1.5 rounded text-sm hover:bg-green-700">Fazer outro agendamento</button>
        </div>
    </div>

    <script>
        // Alterado para garantir que a rota aponte corretamente para o endpoint de horários ocupados criado no backend
        const API_URL = '/api/agendamentos';

        // Lista padrão de horários disponíveis no dia
        const horariosDisponiveis = [
            "08:00", "09:00", "10:00", "11:00", 
            "13:00", "14:00", "15:00", "16:00", "17:00"
        ];

        const inputData = document.getElementById('data');
        inputData.min = new Date().toISOString().split('T')[0];
        
        const selectHorario = document.getElementById('horario');

        inputData.addEventListener('change', async () => {
            const dataSelecionada = inputData.value;
            if (!dataSelecionada) return;

            try {
                // Ajustado para bater exatamente com a rota criada no backend: /api/agendamentos/horarios-ocupados?data=...
                const response = await fetch(`${API_URL}/horarios-ocupados?data=${dataSelecionada}`);
                
                if (!response.ok) {
                    throw new Error('Erro ao buscar horários ocupados');
                }

                const horariosOcupados = await response.json(); 

                selectHorario.innerHTML = '<option value="" disabled selected>Selecione um horário</option>';

                horariosDisponiveis.forEach(h => {
                    const option = document.createElement('option');
                    option.value = h;
                    option.textContent = h;

                    if (horariosOcupados.includes(h)) {
                        option.disabled = true;
                        option.textContent += ' (Indisponível)';
                        option.className = 'text-gray-400 bg-gray-100';
                    }

                    selectHorario.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao buscar horários ocupados:", error);
                selectHorario.innerHTML = '<option value="" disabled selected>Erro ao carregar horários</option>';
            }
        });

        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                nomeCliente: document.getElementById('nomeCliente').value,
                telefone: document.getElementById('telefone').value,
                servico: document.getElementById('servico').value,
                data: document.getElementById('data').value,
                horario: document.getElementById('horario').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (!response.ok) {
                    alert(resultado.erro || "Erro ao realizar agendamento.");
                    return;
                }

                document.getElementById('formAgendamento').classList.add('hidden');
                document.getElementById('mensagemSucesso').classList.remove('hidden');
                
                document.getElementById('detalhesConfirmacao').innerHTML = `
                    <p><strong>Cliente:</strong> ${resultado.nomeCliente}</p>
                    <p><strong>Serviço:</strong> ${resultado.servico}</p>
                    <p><strong>Data:</strong> ${resultado.data}</p>
                    <p><strong>Horário:</strong> ${resultado.horario}</p>
                    <p><strong>Status:</strong> <span class="text-blue-600 font-semibold">${resultado.status}</span></p>
                `;

            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão com o servidor.");
            }
        });

        function novoAgendamento() {
            document.getElementById('formAgendamento').reset();
            document.getElementById('mensagemSucesso').classList.add('hidden');
            document.getElementById('formAgendamento').classList.remove('hidden');
            selectHorario.innerHTML = '<option value="" disabled selected>Selecione a data primeiro</option>';
        }
    </script>
</body>
</html>
